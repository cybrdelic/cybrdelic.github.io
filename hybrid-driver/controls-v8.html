<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#03060b">
<title>Hybrid Driver v8 Scale + Controls</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03060b;color:#eef5ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#hud{position:fixed;z-index:20;left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));pointer-events:none}#panel{display:inline-block;max-width:min(760px,96vw);padding:8px 10px;border:1px solid rgba(255,255,255,.13);border-radius:11px;background:rgba(3,6,11,.66);backdrop-filter:blur(9px);font-size:10px}#row{display:flex;justify-content:space-between;gap:16px;font-size:12px;font-weight:900}#sub,#asset,#car,#sensor{opacity:.8;margin-top:3px}#controls{position:fixed;z-index:999;inset:0;pointer-events:none}.btn{pointer-events:auto;position:absolute;border:1px solid rgba(255,255,255,.22);background:rgba(5,9,15,.78);color:#fff;border-radius:12px;padding:10px 12px;font-weight:850}#reset{left:max(14px,env(safe-area-inset-left));top:86px}#gyro{right:max(14px,env(safe-area-inset-right));top:86px}.pedal{pointer-events:auto;position:absolute;bottom:max(14px,env(safe-area-inset-bottom));width:94px;height:94px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.35);background:rgba(5,10,17,.58);backdrop-filter:blur(8px);font-weight:900;user-select:none;-webkit-user-select:none;touch-action:none}#brake{left:max(14px,env(safe-area-inset-left))}#gas{right:max(14px,env(safe-area-inset-right))}.steer{pointer-events:auto;position:absolute;bottom:max(22px,calc(env(safe-area-inset-bottom) + 8px));width:88px;height:78px;border-radius:22px;border:2px solid rgba(255,255,255,.5);background:rgba(15,25,38,.78);color:white;font-size:36px;font-weight:900;box-shadow:0 8px 30px rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none}.steer:active{transform:scale(.94);background:rgba(65,95,130,.9)}#left{left:calc(50% - 104px)}#right{right:calc(50% - 104px)}#label{position:absolute;left:50%;transform:translateX(-50%);bottom:max(108px,calc(env(safe-area-inset-bottom) + 94px));padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.58);font-size:11px;font-weight:800;white-space:nowrap;pointer-events:none}#badge{position:absolute;left:50%;transform:translateX(-50%);top:max(14px,env(safe-area-inset-top));padding:5px 8px;border-radius:999px;background:#fff;color:#111;font-size:10px;font-weight:900;pointer-events:none}#toast{position:fixed;z-index:1200;display:none;left:50%;top:50%;transform:translate(-50%,-50%);max-width:82vw;padding:12px 15px;border-radius:11px;border:1px solid rgba(255,255,255,.16);background:rgba(2,5,9,.92);text-align:center;font-size:12px}@media(orientation:landscape){#reset,#gyro{top:70px}.pedal{width:86px;height:86px}.steer{width:82px;height:68px;bottom:max(16px,env(safe-area-inset-bottom))}#label{bottom:max(92px,calc(env(safe-area-inset-bottom) + 75px))}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>
</head>
<body>
<div id="hud"><div id="panel"><div id="row"><span>AUTHORED CITY NIGHT RUN v8</span><span id="speed">0 MPH</span></div><div id="sub"><span id="backend">initializing…</span> · <span id="hybrid">PBR</span> · <span id="fps">-- FPS</span></div><div id="asset">Authored city: queued</div><div id="car">Ferrari: queued</div><div id="sensor">gyro OFF</div></div></div>
<div id="controls"><div id="badge">SCALE + STEERING FIX v8</div><button id="reset" class="btn">RESET</button><button id="gyro" class="btn">ENABLE GYRO</button><div id="brake" class="pedal">BRAKE</div><div id="gas" class="pedal">GAS</div><button id="left" class="steer" aria-label="Steer left">◀</button><button id="right" class="steer" aria-label="Steer right">▶</button><div id="label">HOLD ◀ / ▶ TO STEER</div></div><div id="toast"></div>
<script type="module" src="./pre-v8.js?v=8"></script>
<script type="module" src="./app-v6.js?v=8-scale"></script>
<script>
window.addEventListener('load',()=>{
 const cv=()=>document.querySelector('canvas'); let timer=null,x=innerWidth/2,active=0;
 const dispatch=(type)=>{const c=cv();if(!c)return;c.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:777,pointerType:'touch',isPrimary:true,clientX:x,clientY:Math.min(innerHeight*.35,220),buttons:type==='pointerup'?0:1}))};
 // app-v6's yaw convention is opposite screen X, so positive pointer movement turns LEFT.
 function start(visualDir){
   active=visualDir;
   x=innerWidth/2;
   dispatch('pointerdown');
   clearInterval(timer);
   timer=setInterval(()=>{
     if(!active)return;
     // Corrected mapping: LEFT button moves synthetic pointer RIGHT; RIGHT moves LEFT.
     x += -active*10;
     dispatch('pointermove');
   },16);
 }
 function stop(){active=0;clearInterval(timer);timer=null;dispatch('pointerup')}
 for(const [id,visualDir] of [['left',-1],['right',1]]){
   const e=document.getElementById(id);
   e.addEventListener('pointerdown',ev=>{ev.preventDefault();start(visualDir)});
   e.addEventListener('pointerup',ev=>{ev.preventDefault();stop()});
   e.addEventListener('pointercancel',stop);
 }
 addEventListener('keydown',e=>{
   if(e.repeat)return;
   const k=e.key.toLowerCase();
   if(k==='a'||k==='arrowleft')start(-1);
   if(k==='d'||k==='arrowright')start(1);
   if(k==='w'||k==='arrowup')document.getElementById('gas').dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerType:'touch'}));
   if(k==='s'||k==='arrowdown')document.getElementById('brake').dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerType:'touch'}));
 });
 addEventListener('keyup',e=>{
   const k=e.key.toLowerCase();
   if(k==='a'||k==='arrowleft'||k==='d'||k==='arrowright')stop();
   if(k==='w'||k==='arrowup')document.getElementById('gas').dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerType:'touch'}));
   if(k==='s'||k==='arrowdown')document.getElementById('brake').dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerType:'touch'}));
 });
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#03060b">
<title>WebGPU Ferrari Night Run v4</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03060b;color:#eef5ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;z-index:20;left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));pointer-events:none}
#panel{display:inline-block;max-width:min(700px,95vw);padding:8px 10px;border:1px solid rgba(255,255,255,.13);border-radius:11px;background:rgba(3,6,11,.62);backdrop-filter:blur(9px);font-size:10px}
#row{display:flex;justify-content:space-between;gap:16px;font-size:12px;font-weight:900}
#sub,#asset,#sensor{opacity:.8;margin-top:3px}
#controls{position:fixed;z-index:30;inset:0;pointer-events:none}
.btn{pointer-events:auto;position:absolute;border:1px solid rgba(255,255,255,.18);background:rgba(5,9,15,.7);color:#fff;border-radius:10px;padding:9px 11px;font-weight:850}
#reset{left:max(14px,env(safe-area-inset-left));top:82px}
#gyro{right:max(14px,env(safe-area-inset-right));top:82px}
.pedal{pointer-events:auto;position:absolute;bottom:max(14px,env(safe-area-inset-bottom));width:94px;height:94px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.2);background:rgba(5,10,17,.42);backdrop-filter:blur(8px);font-weight:900;user-select:none}
#brake{left:max(14px,env(safe-area-inset-left))}
#gas{right:max(14px,env(safe-area-inset-right))}
#toast{position:fixed;z-index:60;display:none;left:50%;top:50%;transform:translate(-50%,-50%);max-width:82vw;padding:12px 15px;border-radius:11px;border:1px solid rgba(255,255,255,.16);background:rgba(2,5,9,.92);text-align:center;font-size:12px}
@media(orientation:landscape){#reset,#gyro{top:64px}.pedal{width:86px;height:86px}}
</style>
<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js",
  "three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js",
  "three/tsl":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.tsl.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
 }
}
</script>
</head>
<body>
<div id="hud"><div id="panel">
 <div id="row"><span>FERRARI NIGHT RUN v4</span><span id="speed">0 MPH</span></div>
 <div id="sub"><span id="backend">initializing…</span> · <span id="hybrid">direct PBR</span> · <span id="fps">-- FPS</span></div>
 <div id="asset">Ferrari: queued</div>
 <div id="sensor">gyro OFF</div>
</div></div>
<div id="controls">
 <button id="reset" class="btn">RESET</button>
 <button id="gyro" class="btn">ENABLE GYRO</button>
 <div id="brake" class="pedal">BRAKE</div>
 <div id="gas" class="pedal">GAS</div>
</div>
<div id="toast"></div>

<script type="module">
import * as THREE from 'three/webgpu';
import {
  pass, mrt, output, diffuseColor, normalView, velocity,
  metalness, roughness, vec2, vec4, add,
  packNormalToRGB, unpackRGBToNormal, sample
} from 'three/tsl';
import { ssgi } from 'three/addons/tsl/display/SSGINode.js';
import { ssr } from 'three/addons/tsl/display/SSRNode.js';
import { smaa } from 'three/addons/tsl/display/SMAANode.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const $=id=>document.getElementById(id);
function toast(s,ms=3000){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',ms)}

const renderer=new THREE.WebGPURenderer({antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,.9));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.18;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);

await renderer.init();

const nativeGPU=renderer.backend?.isWebGPUBackend===true;
$('backend').textContent=nativeGPU?'NATIVE WEBGPU':'WEBGL2 FALLBACK';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030711);
scene.fog=new THREE.FogExp2(0x07101d,.0085);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.08,260);

const env=new RoomEnvironment();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(env,.04).texture;
scene.environmentIntensity=1.3;
pmrem.dispose();

scene.add(new THREE.HemisphereLight(0x718aad,0x090a0d,.3));
const moon=new THREE.DirectionalLight(0xb7d6ff,2.8);
moon.position.set(-24,38,18);moon.castShadow=true;
moon.shadow.mapSize.set(1024,1024);
moon.shadow.camera.left=-28;moon.shadow.camera.right=28;moon.shadow.camera.top=28;moon.shadow.camera.bottom=-28;
moon.shadow.camera.near=.1;moon.shadow.camera.far=105;moon.shadow.normalBias=.025;scene.add(moon);

const N=560,roadWidth=7.6,track=[];
for(let i=0;i<N;i++){
 const a=i/N*Math.PI*2;
 const r=56+Math.sin(a*2)*9+Math.sin(a*5+.4)*5+Math.sin(a*8)*1.2;
 track.push(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r));
}
function frameAt(i){
 const p=track[i],q=track[(i+1)%N],t=q.clone().sub(p).normalize(),s=new THREE.Vector3(-t.z,0,t.x);
 return {p,t,s,yaw:Math.atan2(t.x,t.z)};
}
const rp=[],ri=[];
for(let i=0;i<N;i++){
 const {p,s}=frameAt(i),L=p.clone().addScaledVector(s,roadWidth),R=p.clone().addScaledVector(s,-roadWidth);
 rp.push(L.x,.02,L.z,R.x,.02,R.z);
}
for(let i=0;i<N;i++){const j=(i+1)%N;ri.push(i*2,j*2,i*2+1,j*2,j*2+1,i*2+1)}
const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.Float32BufferAttribute(rp,3));rg.setIndex(ri);rg.computeVertexNormals();
const road=new THREE.Mesh(rg,new THREE.MeshPhysicalMaterial({
 color:0x0b1017,metalness:.5,roughness:.16,clearcoat:1,clearcoatRoughness:.035,envMapIntensity:1.45
}));
road.receiveShadow=true;scene.add(road);

const ground=new THREE.Mesh(new THREE.CircleGeometry(150,128),new THREE.MeshStandardMaterial({color:0x101812,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.y=-.03;ground.receiveShadow=true;scene.add(ground);

const concrete=new THREE.MeshStandardMaterial({color:0x39434e,roughness:.48,envMapIntensity:.6});
const wet=new THREE.MeshPhysicalMaterial({color:0x17232e,metalness:.38,roughness:.14,clearcoat:1,clearcoatRoughness:.025,envMapIntensity:1.5});
const cyanMat=new THREE.MeshStandardMaterial({color:0x087aa9,emissive:0x20caff,emissiveIntensity:13,roughness:.22});
const pinkMat=new THREE.MeshStandardMaterial({color:0x8a1751,emissive:0xff278f,emissiveIntensity:13,roughness:.22});
const amberMat=new THREE.MeshStandardMaterial({color:0x8d5714,emissive:0xffa62f,emissiveIntensity:11,roughness:.25});
const whiteMat=new THREE.MeshStandardMaterial({color:0xcbd3d8,emissive:0xeaf7ff,emissiveIntensity:9,roughness:.18});

const tunnel=[];
for(let i=100;i<=225;i+=5)tunnel.push(i);
for(let i=345;i<=455;i+=5)tunnel.push(i);

for(let k=0;k<tunnel.length;k++){
 const {p,s,yaw}=frameAt(tunnel[k]),len=4.9;
 const roof=new THREE.Mesh(new THREE.BoxGeometry(roadWidth*2+2.4,.38,len+.5),concrete);
 roof.position.set(p.x,5.15,p.z);roof.rotation.y=yaw;roof.castShadow=roof.receiveShadow=true;scene.add(roof);

 for(const side of [-1,1]){
   const wall=new THREE.Mesh(new THREE.BoxGeometry(.4,5.0,len+.5),wet);
   wall.position.copy(p).addScaledVector(s,side*(roadWidth+1.0));wall.position.y=2.5;wall.rotation.y=yaw;wall.castShadow=wall.receiveShadow=true;scene.add(wall);

   for(const yy of [1.25,3.55]){
     const strip=new THREE.Mesh(new THREE.BoxGeometry(.065,.11,len*.88),(k&1)?cyanMat:pinkMat);
     strip.position.copy(wall.position).addScaledVector(s,-side*.23);strip.position.y=yy;strip.rotation.y=yaw;scene.add(strip);
   }
 }

 const fixture=new THREE.Mesh(new THREE.BoxGeometry(2.4,.06,1.7),whiteMat);
 fixture.position.set(p.x,4.88,p.z);fixture.rotation.y=yaw;scene.add(fixture);

 if(k%2===0){
   const colored=new THREE.PointLight((k&1)?0x24c9ff:0xff2a91,24,14,2);
   colored.position.set(p.x,3.45,p.z);scene.add(colored);
 }
 if(k%4===0){
   const fill=new THREE.PointLight(0xddeaff,14,11,2);
   fill.position.copy(p).addScaledVector(s,(k%8===0?1:-1)*3.5);fill.position.y=3.6;scene.add(fill);
 }
}

for(const i of [97,228,342,458]){
 const {p,s,yaw}=frameAt(i);
 for(const side of [-1,1]){
   const post=new THREE.Mesh(new THREE.BoxGeometry(.8,5.8,.8),concrete);
   post.position.copy(p).addScaledVector(s,side*(roadWidth+.9));post.position.y=2.9;post.rotation.y=yaw;scene.add(post);
   const lamp=new THREE.Mesh(new THREE.BoxGeometry(.2,.9,.2),amberMat);
   lamp.position.copy(post.position).addScaledVector(s,-side*.43);lamp.position.y=3.1;scene.add(lamp);
   const L=new THREE.PointLight(0xff9d2f,25,12,2);L.position.copy(lamp.position);scene.add(L);
 }
 const beam=new THREE.Mesh(new THREE.BoxGeometry(roadWidth*2+2.5,.8,.8),concrete);beam.position.set(p.x,5.3,p.z);beam.rotation.y=yaw;scene.add(beam);
}

const curbR=new THREE.MeshStandardMaterial({color:0x9f1722,roughness:.4});
const curbW=new THREE.MeshStandardMaterial({color:0xe1e4e7,roughness:.35});
for(let i=0;i<N;i+=7){
 const {p,s,yaw}=frameAt(i);
 for(const side of [-1,1]){
   const c=new THREE.Mesh(new THREE.BoxGeometry(.62,.1,1.75),((i/7)&1)?curbR:curbW);
   c.position.copy(p).addScaledVector(s,side*(roadWidth+.25));c.position.y=.05;c.rotation.y=yaw;scene.add(c);
 }
}

const carRoot=new THREE.Group();scene.add(carRoot);
const fallback=new THREE.Group();
const fbBody=new THREE.Mesh(new THREE.BoxGeometry(1.82,.52,4.1),new THREE.MeshPhysicalMaterial({
 color:0x233b53,metalness:1,roughness:.13,clearcoat:1,clearcoatRoughness:.018,envMapIntensity:1.7
}));
fbBody.position.y=.62;fbBody.castShadow=true;fallback.add(fbBody);
const fbCabin=new THREE.Mesh(new THREE.BoxGeometry(1.48,.52,1.72),new THREE.MeshPhysicalMaterial({color:0x102b3b,roughness:.035,transmission:.5,transparent:true,opacity:.9}));
fbCabin.position.set(0,1.03,-.2);fallback.add(fbCabin);
for(const x of [-.92,.92])for(const z of [-1.27,1.27]){
 const w=new THREE.Mesh(new THREE.CylinderGeometry(.37,.37,.28,18),new THREE.MeshStandardMaterial({color:0x060709,roughness:.7}));
 w.rotation.z=Math.PI/2;w.position.set(x,.42,z);fallback.add(w);
}
carRoot.add(fallback);

for(const x of [-.52,.52]){
 const spot=new THREE.SpotLight(0xd9efff,55,42,.33,.4,1.4);
 spot.position.set(x,.72,-1.7);spot.target.position.set(x,.12,-22);fallback.add(spot,spot.target);
 const lens=new THREE.Mesh(new THREE.BoxGeometry(.25,.1,.05),whiteMat);lens.position.set(x,.69,-2.07);fallback.add(lens);
}
const tailL=new THREE.PointLight(0xff1538,11,6,2);tailL.position.set(0,.7,2.0);fallback.add(tailL);

const draco=new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/libs/draco/');
const loader=new GLTFLoader();loader.setDRACOLoader(draco);

const ferrariURLs=[
 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r185/examples/models/gltf/ferrari.glb',
 'https://threejs.org/examples/models/gltf/ferrari.glb',
 'https://rawcdn.githack.com/mrdoob/three.js/r185/examples/models/gltf/ferrari.glb'
];
let urlIndex=0,ferrariLoaded=false;
function loadFerrari(){
 if(urlIndex>=ferrariURLs.length){
   $('asset').textContent='Ferrari: all mirrors failed — fallback car active';
   return;
 }
 const url=ferrariURLs[urlIndex++];
 $('asset').textContent=`Ferrari: loading mirror ${urlIndex}/${ferrariURLs.length}`;
 loader.load(url,g=>{
   const real=g.scene.children[0]||g.scene;
   real.scale.setScalar(1.03);real.rotation.y=Math.PI;real.position.y=.02;
   real.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
   const body=real.getObjectByName('body');
   if(body)body.material=new THREE.MeshPhysicalMaterial({color:0x8d0712,metalness:.95,roughness:.16,clearcoat:1,clearcoatRoughness:.018,envMapIntensity:1.65});
   const glass=real.getObjectByName('glass');
   if(glass)glass.material=new THREE.MeshPhysicalMaterial({color:0x9bc0d9,metalness:.05,roughness:.025,transmission:.78,transparent:true,opacity:.92,envMapIntensity:1.5});
   carRoot.remove(fallback);carRoot.add(real);ferrariLoaded=true;
   $('asset').textContent=`Ferrari: LOADED from mirror ${urlIndex}`;
 },xhr=>{
   if(xhr.total)$('asset').textContent=`Ferrari: mirror ${urlIndex} ${Math.round(xhr.loaded/xhr.total*100)}%`;
 },()=>setTimeout(loadFerrari,120));
}
loadFerrari();

let pipeline=null,hybridActive=false,hybridFailed=false;
function buildHybrid(){
 if(!nativeGPU||hybridFailed)return;
 try{
   pipeline=new THREE.RenderPipeline(renderer);
   const scenePass=pass(scene,camera);
   scenePass.setMRT(mrt({
     output:output,
     diffuseColor:diffuseColor,
     normal:packNormalToRGB(normalView),
     velocity:velocity,
     metalrough:vec2(metalness,roughness)
   }));

   const c=scenePass.getTextureNode('output');
   const d=scenePass.getTextureNode('diffuseColor');
   const z=scenePass.getTextureNode('depth');
   const np=scenePass.getTextureNode('normal');
   const mr=scenePass.getTextureNode('metalrough');

   scenePass.getTexture('diffuseColor').type=THREE.UnsignedByteType;
   scenePass.getTexture('normal').type=THREE.UnsignedByteType;
   scenePass.getTexture('metalrough').type=THREE.UnsignedByteType;

   const n=sample(uv=>unpackRGBToNormal(np.sample(uv)));

   const gi=ssgi(c,z,n,camera);
   gi.sliceCount.value=1;
   gi.stepCount.value=5;
   gi.radius.value=6;
   gi.giIntensity.value=1.35;
   gi.aoIntensity.value=.9;

   const ao=gi.getAONode();
   const indirect=gi.getGINode();
   const composite=vec4(add(c.rgb.mul(ao.r),d.rgb.mul(indirect.rgb)),c.a);

   const reflections=ssr(composite,z,n,{
     metalnessNode:mr.r,
     roughnessNode:mr.g
   });
   reflections.quality.value=.3;
   reflections.maxDistance.value=.55;
   reflections.intensity.value=.75;
   reflections.thickness.value=.035;

   pipeline.outputNode=smaa(composite.add(reflections.rgb));
   hybridActive=true;
   $('hybrid').textContent='SSGI + AO + SSR ACTIVE';
 }catch(e){
   hybridFailed=true;pipeline=null;
   $('hybrid').textContent='hybrid init failed → direct PBR';
 }
}

let px=track[0].x,pz=track[0].z,yaw=0,speed=0,steer=0,steerInput=0,throttle=0,brake=0,nearest=0;
function resetCar(){const p=track[0],q=track[1];px=p.x;pz=p.z;yaw=Math.atan2(q.x-p.x,q.z-p.z);speed=0;steer=0;steerInput=0;nearest=0;carRoot.position.set(px,.04,pz);carRoot.rotation.y=yaw}
$('reset').onclick=resetCar;
function bindHold(id,on,off){const e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();on();navigator.vibrate?.(6)});e.addEventListener('pointerup',ev=>{ev.preventDefault();off()});e.addEventListener('pointercancel',ev=>{ev.preventDefault();off()})}
bindHold('gas',()=>throttle=1,()=>throttle=0);bindHold('brake',()=>brake=1,()=>brake=0);
function nearestRoad(x,z,start){let bi=start,bd=1e9;for(let k=-24;k<=24;k++){const i=(start+k+N)%N,p=track[i],dx=p.x-x,dz=p.z-z,dd=dx*dx+dz*dz;if(dd<bd){bd=dd;bi=i}}return[bi,Math.sqrt(bd)]}

let gyro=false,alpha=null,baseAlpha=null,events=0;
function wrap(v){while(v>180)v-=360;while(v<-180)v+=360;return v}
addEventListener('deviceorientation',e=>{if(e.alpha==null)return;alpha=e.alpha;events++;if(gyro){if(baseAlpha==null)baseAlpha=alpha;steerInput=THREE.MathUtils.clamp(wrap(alpha-baseAlpha)/38,-1,1)}},true);
$('gyro').onclick=async()=>{
 if(gyro){baseAlpha=alpha;steerInput=0;toast('Gyro recentered',1000);return}
 try{
   if(typeof DeviceOrientationEvent==='undefined')throw new Error('API unavailable');
   if(typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw new Error('permission denied')}
   gyro=true;baseAlpha=alpha;$('gyro').textContent='RECENTER GYRO';toast(alpha==null?'Permission granted, but this preview is not delivering sensor events.':'Rotate phone like a steering wheel',2500);
 }catch(e){toast('Gyro unavailable: '+e.message,3500)}
};

let sp=null,lastX=0;
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientY<innerHeight*.72){sp=e.pointerId;lastX=e.clientX}});
renderer.domElement.addEventListener('pointermove',e=>{if(!gyro&&e.pointerId===sp){steerInput=THREE.MathUtils.clamp(steerInput+(e.clientX-lastX)/80,-1,1);lastX=e.clientX}});
renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===sp)sp=null});

const camPos=new THREE.Vector3(),look=new THREE.Vector3();
let last=performance.now(),fpsStamp=last,frames=0,baseFrames=0;
function update(dt){
 const [ni,dist]=nearestRoad(px,pz,nearest);nearest=ni;const off=Math.max(0,dist-roadWidth);
 const engine=throttle*(19*(1-Math.max(0,speed)/74)),brk=brake*33,res=.18+.0098*speed*speed+(off>0?8+off*2.5:0);
 speed+=(engine-res-brk)*dt;speed=THREE.MathUtils.clamp(speed,0,74);
 if(!gyro&&sp===null)steerInput*=Math.exp(-dt*4.5);
 steer+=(steerInput-steer)*(1-Math.exp(-dt*10));
 yaw+=steer*.72/(1+speed*.018)*speed*.061*dt;
 px+=Math.sin(yaw)*speed*dt;pz+=Math.cos(yaw)*speed*dt;
 if(off>5){const p=track[nearest];px+=(p.x-px)*dt*.8;pz+=(p.z-pz)*dt*.8;speed*=Math.pow(.45,dt)}
 carRoot.position.set(px,.04,pz);carRoot.rotation.y=yaw;
 const land=innerWidth>innerHeight,back=land?7.0:7.8,h=land?2.25:2.9;
 const target=new THREE.Vector3(px-Math.sin(yaw)*back,h,pz-Math.cos(yaw)*back);
 camPos.lerp(target,1-Math.exp(-dt*7));camera.position.copy(camPos);
 look.set(px+Math.sin(yaw)*5,.8,pz+Math.cos(yaw)*5);camera.lookAt(look);
 $('speed').textContent=Math.round(speed*2.237)+' MPH';
 $('sensor').textContent=`gyro ${gyro?'ON':'OFF'} · alpha ${alpha==null?'--':alpha.toFixed(1)}° · events ${events}`;
}

function animate(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);
 try{
   if(hybridActive&&pipeline)pipeline.render();
   else renderer.render(scene,camera);
 }catch(e){
   hybridActive=false;hybridFailed=true;pipeline=null;
   $('hybrid').textContent='hybrid runtime failed → direct PBR';
   renderer.render(scene,camera);
 }
 baseFrames++;
 if(baseFrames===3&&nativeGPU)buildHybrid();

 frames++;
 if(now-fpsStamp>900){$('fps').textContent=Math.round(frames*1000/(now-fpsStamp))+' FPS';frames=0;fpsStamp=now}
}
resetCar();camPos.set(px,2.5,pz-7);renderer.setAnimationLoop(animate);

addEventListener('resize',()=>{renderer.setPixelRatio(Math.min(devicePixelRatio,.9));renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
</script>
</body>
</html>

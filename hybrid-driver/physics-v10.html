<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#03060b"><title>Hybrid Driver Physics v10</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03060b;color:#eef5ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#hud{position:fixed;z-index:20;left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));pointer-events:none}#panel{display:inline-block;padding:8px 10px;border:1px solid rgba(255,255,255,.13);border-radius:11px;background:rgba(3,6,11,.68);backdrop-filter:blur(9px);font-size:10px}#row{display:flex;justify-content:space-between;gap:18px;font-size:12px;font-weight:900}#sub,#asset,#car,#sensor{opacity:.8;margin-top:3px}#controls{position:fixed;z-index:999;inset:0;pointer-events:none}.btn{pointer-events:auto;position:absolute;border:1px solid rgba(255,255,255,.22);background:rgba(5,9,15,.78);color:white;border-radius:12px;padding:10px 12px;font-weight:850}#reset{left:max(14px,env(safe-area-inset-left));top:86px}#gyro{right:max(14px,env(safe-area-inset-right));top:86px}.pedal{pointer-events:auto;position:absolute;bottom:max(14px,env(safe-area-inset-bottom));width:94px;height:94px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.35);background:rgba(5,10,17,.58);font-weight:900;touch-action:none;user-select:none}#brake{left:max(14px,env(safe-area-inset-left))}#gas{right:max(14px,env(safe-area-inset-right))}.steer{pointer-events:auto;position:absolute;bottom:max(22px,calc(env(safe-area-inset-bottom) + 8px));width:88px;height:78px;border-radius:22px;border:2px solid rgba(255,255,255,.5);background:rgba(15,25,38,.8);color:white;font-size:36px;font-weight:900;touch-action:none;user-select:none}#left{left:calc(50% - 104px)}#right{right:calc(50% - 104px)}#badge{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);padding:5px 9px;border-radius:999px;background:#fff;color:#111;font-size:10px;font-weight:900;pointer-events:none}#toast{position:fixed;z-index:1200;display:none;left:50%;top:50%;transform:translate(-50%,-50%);max-width:82vw;padding:12px 15px;border-radius:11px;background:rgba(2,5,9,.92);border:1px solid rgba(255,255,255,.16);text-align:center;font-size:12px}@media(orientation:landscape){#reset,#gyro{top:70px}.pedal{width:86px;height:86px}.steer{width:82px;height:68px;bottom:max(16px,env(safe-area-inset-bottom))}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/","three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.13/src/index.js"}}</script></head><body><div id="hud"><div id="panel"><div id="row"><span>TRIANGLE-BVH DRIVER v10</span><span id="speed">0 MPH</span></div><div id="sub"><span id="backend">initializing…</span> · triangle contacts + CCD · <span id="fps">-- FPS</span></div><div id="asset">City: queued</div><div id="car">Ferrari: queued</div><div id="sensor">physics starting…</div></div></div><div id="controls"><div id="badge">BVH COLLISIONS v10</div><button id="reset" class="btn">RESET</button><button id="gyro" class="btn">ENABLE GYRO</button><div id="brake" class="pedal">BRAKE</div><div id="gas" class="pedal">GAS</div><button id="left" class="steer">◀</button><button id="right" class="steer">▶</button></div><div id="toast"></div><script type="module" src="./app-v10.js?v=10"></script><script>addEventListener('load',()=>{const bind=(id,dir)=>{const e=document.getElementById(id);const on=x=>{x.preventDefault();window.__setSteerButton?.(dir,true)};const off=x=>{x?.preventDefault?.();window.__setSteerButton?.(dir,false)};e.addEventListener('pointerdown',on);e.addEventListener('pointerup',off);e.addEventListener('pointercancel',off);e.addEventListener('pointerleave',x=>{if(x.buttons===0)off(x)})};bind('left',-1);bind('right',1)});</script></body></html>

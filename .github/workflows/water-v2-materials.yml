name: Water V2 material assets
on:
  push:
    branches: [cybr-water-v2]
    paths: ['.github/workflows/water-v2-materials.yml']
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download published CC0 surface textures
        run: |
          set -euo pipefail
          mkdir -p maps
          for asset in rock_face damp_sand; do
            for channel in diff nor_gl; do
              curl --retry 3 --fail --location "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/${asset}/${asset}_${channel}_2k.jpg" -o "maps/${asset}_${channel}.jpg"
            done
          done
          printf '%s\n' 'CC0 Poly Haven: rock_face by Dario Barresi and Greg Zaal, https://polyhaven.com/a/rock_face' 'CC0 Poly Haven: damp_sand by eye-candy.xyz, https://polyhaven.com/a/damp_sand' > maps/ATTRIBUTION.txt
          sha256sum maps/*.jpg > maps/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: water-v2-CC0-materials
          path: maps/
          retention-days: 7

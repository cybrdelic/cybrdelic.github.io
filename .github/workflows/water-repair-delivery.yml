name: Water repair - final verified packaging
on:
  push:
    branches: [cybr-water-repair-20260906]
    paths: ['.github/workflows/water-repair-delivery.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: water-repair-packaging
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cybr-water-repair-20260906
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require every final recording and completed source job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import urllib.request,json,os,time,pathlib
          base='https://api.github.com/repos/cybrdelic/cybrdelic.github.io/actions/runs/34041087283/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def get(s):return json.load(urllib.request.urlopen(urllib.request.Request(base+s,headers=headers),timeout=50))
          required={f'water-final-shot-{i}' for i in range(30)}|{'water-final-runtime','water-final-controls'}
          for attempt in range(100):
              arts=get('artifacts?per_page=100');present={a['name'] for a in arts['artifacts']}
              print('Final artifacts present:',len(required&present),'/',len(required),flush=True)
              if required<=present:
                  jobs=get('jobs?per_page=100')['jobs'];captures=[j for j in jobs if j['name'].startswith('capture (')]
                  if len(captures)==30 and all(j['status']=='completed' for j in captures):break
              time.sleep(10)
          else:raise RuntimeError('Not every final native recording completed')
          for name in ['build','controls']:assert next(j for j in jobs if j['name']==name)['conclusion']=='success',name
          audits=[]
          for job in captures:
              req=urllib.request.Request('https://api.github.com/repos/cybrdelic/cybrdelic.github.io/actions/jobs/'+str(job['id'])+'/logs',headers=headers)
              log=urllib.request.urlopen(req,timeout=60).read().decode('utf-8-sig')
              missing=[l for l in log.splitlines() if 'tee: renders/final-' in l and 'No such file or directory' in l]
              assert len(missing)==1,(job['name'],'unexpected logging failure')
              assert 'BROWSER ERROR' not in log and 'Traceback (most recent call last)' not in log,job['name']
              assert 'REPAIR VERIFICATION' in log and '"passed": true' in log and 'DONE ' in log,job['name']
              audits.append({'job':job['name'],'jobId':job['id'],'originalJobConclusion':job['conclusion'],'completeRecording':True,'graphicsVerificationPassed':True,'harnessIssue':missing[0],'remedy':'Create output directory before starting tee; retain complete, validated rendered frames.'})
          pathlib.Path('/tmp/capture-harness-audit.json').write_text(json.dumps({'run':34041087283,'artifacts':arts['artifacts'],'jobs':audits},indent=2))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: water-final-runtime
          github-token: ${{ github.token }}
          run-id: 34041087283
          path: /tmp/water-repair/CYBR-WATER-II
      - uses: actions/download-artifact@v4
        with:
          pattern: water-final-shot-*
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 34041087283
          path: /tmp/water-repair/CYBR-WATER-II/renders
      - uses: actions/download-artifact@v4
        with:
          pattern: water-baseline-shot-*
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 34039863221
          path: /tmp/water-repair/baseline-renders
      - uses: actions/download-artifact@v4
        with:
          pattern: water-endurance-*
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 34039863221
          path: /tmp/water-repair/CYBR-WATER-II/docs
      - uses: actions/download-artifact@v4
        with:
          name: water-final-controls
          github-token: ${{ github.token }}
          run-id: 34041087283
          path: /tmp/water-repair/CYBR-WATER-II/docs
      - name: Assemble only fully validated final media
        run: |
          python -m pip install pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          cp /tmp/capture-harness-audit.json /tmp/water-repair/CYBR-WATER-II/docs/
          python - <<'PY'
          from pathlib import Path
          p=Path('water-repair-source/release.py');s=p.read_text();p.write_text(s.replace("'59 numerical implementation tests'","'66 numerical implementation tests'"))
          root=Path('/tmp/water-repair/CYBR-WATER-II');(root/'docs/capture-harness-note.md').write_text('# Capture harness correction\n\nEvery final native frame was rendered and the graphics checks passed. The shell logging process tried to open an empty directory before the Python renderer created it, so the original CI jobs returned failure after successful recording. The final packaging job examines all thirty original job logs, requires complete frame counts and clean browser reports, and then assembles the retained frames. Future shell invocations must run `mkdir -p renders` before starting `tee renders/filename.log`. No shaders, wave state, video frames or test assertions were changed for this packaging correction.\n')
          PY
          python water-repair-source/release.py assemble
      - name: Commit isolated final release and preserve unrelated pages
        run: |
          git restore water-repair-source/release.py
          git pull --ff-only origin cybr-water-repair-20260906
          if [ -d water/repair ]; then mv water/repair /tmp/earlier-water-repair; fi
          mkdir -p water/repair
          cp -r /tmp/water-repair/CYBR-WATER-II/public/. water/repair/
          git config user.name 'CYBR WATER build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A water/repair
          git commit -m 'Deliver repaired water with thirty final native recordings, six matched comparisons and 66 tested numerical checks'
          git push origin HEAD:cybr-water-repair-20260906
          git rev-parse HEAD > water/repair/RELEASE-COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: water-delivery-comparison
          path: water/repair/films/00-Before-and-After.mp4
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: water-delivery-ocean
          path: water/repair/films/01-Ocean-and-Whitewater.mp4
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: water-delivery-optics
          path: water/repair/films/02-Depth-and-Underwater.mp4
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: water-delivery-interactions
          path: water/repair/films/03-Wakes-and-Weather.mp4
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: water-delivery-details
          path: water/repair/films/04-Water-Details.mp4
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: water-delivery-verification
          path: water/repair/films/05-Verification-Reel.mp4
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: water-delivery-complete
          path: water/repair/films/CYBR-WATER-2.1-Complete.mp4
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: water-delivery-code-and-checks
          path: |
            water/repair/SOURCE.zip
            water/repair/standalone.html
            water/repair/*.md
            water/repair/*.json
            water/repair/*.txt
            water/repair/docs
            water/repair/films/*.jpg
          retention-days: 7

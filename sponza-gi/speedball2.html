<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0a0d12"><title>Sponza GI</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0d12;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.glass{background:rgba(7,10,15,.68);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}#hud{position:fixed;z-index:10;left:max(9px,env(safe-area-inset-left));top:max(9px,env(safe-area-inset-top));width:min(370px,calc(100vw - 18px));padding:9px;border-radius:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.title{font-size:13px;font-weight:800}.row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.pill,button{font:600 11px/1 system-ui;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#fff;padding:7px 9px}.pill{padding:5px 7px;color:rgba(255,255,255,.75)}button{appearance:none}button.on,button.active{background:#f1f4f8;color:#101318;border-color:transparent}#collapse{width:30px;height:30px;padding:0;font-size:16px}.desc{margin-top:6px;font-size:10px;line-height:1.35;color:rgba(255,255,255,.55)}#hud.min .row,#hud.min .desc{display:none}#hud.min{width:auto}.views{position:fixed;z-index:11;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:5px;max-width:calc(100vw - 16px);overflow-x:auto;padding:6px;border-radius:13px;scrollbar-width:none}.views::-webkit-scrollbar{display:none}.views button{white-space:nowrap}.loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#0a0d12}.box{text-align:center;max-width:86vw}.lt{font-size:19px;font-weight:850}.muted{font-size:12px;color:rgba(255,255,255,.6);margin-top:7px}#error{display:none;color:#ffb9b9;font-size:12px;line-height:1.4;margin-top:10px}.bar{width:min(310px,72vw);height:4px;margin:14px auto;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}.bar i{display:block;width:28%;height:100%;background:#fff;border-radius:99px;animation:l 1s ease-in-out infinite alternate}@keyframes l{to{transform:translateX(250%)}}@media(max-width:600px){#hud{width:min(330px,calc(100vw - 18px));padding:8px}.desc{display:none}.views button{padding:8px 10px}}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}</script></head><body>
<div id="loading" class="loading"><div class="box"><div class="lt">SPONZA GI</div><div id="loadmsg" class="muted">Starting renderer…</div><div class="bar"><i></i></div><div id="error"></div></div></div>
<div id="hud" class="glass"><div class="top"><div class="title">Sponza · SSGI + GTAO + TRAA + Bloom</div><button id="collapse">−</button></div><div class="row"><span id="backend" class="pill">GPU --</span><span id="fps" class="pill">-- fps</span><span id="scale" class="pill">--%</span></div><div class="row"><button id="gi" class="on">GI</button><button id="ao" class="on">GTAO</button><button id="taa" class="on">TRAA</button><button id="bloom" class="on">Bloom</button><button id="tour">Auto tour</button></div><div class="desc">Corrected WebGPU/TSL graph: direct light + screen-space indirect diffuse + GTAO → TRAA → bloom.</div></div>
<div class="views glass"><button data-view="hero" class="active">Hero</button><button data-view="center">Center</button><button data-view="arcade">Arcade</button><button data-view="balcony">Balcony</button><button data-view="side">Side</button><button data-view="wide">Wide</button></div>
<script type="module">
import * as THREE from 'three/webgpu';
import {pass,mrt,output,normalView,diffuseColor,velocity,vec3,vec4,add,packNormalToRGB,unpackRGBToNormal,sample,uniform,mix} from 'three/tsl';
import {ssgi} from 'three/addons/tsl/display/SSGINode.js';
import {ao as gtao} from 'three/addons/tsl/display/GTAONode.js';
import {traa} from 'three/addons/tsl/display/TRAANode.js';
import {bloom} from 'three/addons/tsl/display/BloomNode.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const $=id=>document.getElementById(id),mobile=matchMedia('(pointer:coarse)').matches||/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const state={scale:mobile?.72:.92,min:mobile?.52:.70,max:mobile?.84:1,tour:false};
let renderer,scene,camera,controls,pipeline,root,box,presets={},transition=null,tourAt=0,tourI=0,frames=0,fpsStart=performance.now(),perf=0,perfN=0;
const giW=uniform(1),aoW=uniform(1),taaW=uniform(1),bloomW=uniform(1),ray=new THREE.Raycaster();
function fail(m){$('error').style.display='block';$('error').textContent=m;$('loadmsg').textContent='Could not start demo'}
function b(id,v){$(id).classList.toggle('on',v>0.5)}
async function init(){try{
 renderer=new THREE.WebGPURenderer({antialias:false,powerPreference:'high-performance'});renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;document.body.prepend(renderer.domElement);await renderer.init();$('backend').textContent=navigator.gpu?'WebGPU':'WebGL2';
 scene=new THREE.Scene();scene.background=new THREE.Color(0x151a23);camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.05,500);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.screenSpacePanning=true;controls.touches.ONE=THREE.TOUCH.ROTATE;controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;
 scene.add(new THREE.HemisphereLight(0xe2ecff,0x5b493d,1.75));const sun=new THREE.DirectionalLight(0xffdfb7,5.0);sun.position.set(-12,20,10);scene.add(sun);const fill=new THREE.DirectionalLight(0xa7c7ff,1.6);fill.position.set(12,10,-8);scene.add(fill);scene.add(new THREE.AmbientLight(0xffffff,.28));
 $('loadmsg').textContent='Loading Sponza…';const loader=new GLTFLoader(),urls=['https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets@main/Models/Sponza/glTF/Sponza.gltf','https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Sponza/glTF/Sponza.gltf'];let g=null,e0;for(const u of urls){try{g=await loader.loadAsync(u);break}catch(e){e0=e}}if(!g)throw e0||Error('Sponza sources failed');root=g.scene;root.scale.setScalar(.01);root.updateMatrixWorld(true);root.traverse(o=>{if(o.isMesh&&o.material){o.material.side=THREE.FrontSide;o.material.needsUpdate=true}});scene.add(root);box=new THREE.Box3().setFromObject(root);makeViews();go('hero',true);
 buildPipeline();resize();$('loading').style.display='none';renderer.setAnimationLoop(loop);
}catch(e){console.error(e);fail(e?.message||String(e))}}
function buildPipeline(){pipeline=new THREE.RenderPipeline(renderer);const p=pass(scene,camera);p.setMRT(mrt({output,diffuseColor,normal:packNormalToRGB(normalView),velocity}));const color=p.getTextureNode('output'),diff=p.getTextureNode('diffuseColor'),depth=p.getTextureNode('depth'),normalPacked=p.getTextureNode('normal'),vel=p.getTextureNode('velocity');p.getTexture('diffuseColor').type=THREE.UnsignedByteType;p.getTexture('normal').type=THREE.UnsignedByteType;p.getTexture('velocity').type=THREE.HalfFloatType;const normal=sample(uv=>unpackRGBToNormal(normalPacked.sample(uv)));
 const gi=ssgi(color,depth,normal,camera);gi.sliceCount.value=mobile?1:2;gi.stepCount.value=mobile?12:8;gi.radius.value=2.4;gi.thickness.value=.65;gi.giIntensity.value=8;gi.aoIntensity.value=0;gi.useTemporalFiltering=true;gi.resolutionScale=mobile?.55:.75;const giTex=gi.getGINode();
 const ao=gtao(depth,normal,camera);ao.radius.value=.7;ao.thickness.value=1.0;ao.samples.value=mobile?8:12;ao.resolutionScale=mobile?.55:.75;ao.useTemporalFiltering=true;const aoTex=ao.getTextureNode();
 const aoFactor=mix(1.0,aoTex.r,aoW.mul(.72));const giTerm=diff.rgb.mul(giTex.rgb).mul(giW);const comp=vec4(add(color.rgb.mul(aoFactor),giTerm),color.a);
 const taa=traa(comp,depth,vel,camera);const preBloom=mix(comp,taa,taaW);const bl=bloom(preBloom,.22,.16,1.05);pipeline.outputNode=preBloom.add(bl.mul(bloomW));pipeline.needsUpdate=true;}
function makeViews(){const c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3()),R=Math.max(s.x,s.z),H=s.y,t0=new THREE.Vector3(c.x,box.min.y+H*.23,c.z);const d={hero:[0,.03,.40,0,-.01,-.12,50],center:[0,.02,.24,0,-.01,-.18,52],arcade:[-.25,-.03,.15,.10,.01,-.22,55],balcony:[-.20,.22,.16,.08,.01,-.10,48],side:[.34,.03,.06,-.10,-.01,-.08,51],wide:[0,.20,.52,0,-.02,-.08,44]};for(const[n,a]of Object.entries(d)){const t=t0.clone().add(new THREE.Vector3(a[3]*R,a[4]*H,a[5]*R)),want=t0.clone().add(new THREE.Vector3(a[0]*R,a[1]*H,a[2]*R));presets[n]={pos:safe(t,want,R*.018),target:t,fov:a[6]}}}
function safe(t,w,m){const dir=w.clone().sub(t),dist=dir.length();dir.normalize();ray.set(t,dir);ray.far=dist;const h=ray.intersectObject(root,true);if(h.length&&h[0].distance<dist*.96)return t.clone().addScaledVector(dir,Math.max(m,h[0].distance-m));return w}
function go(n,instant=false){const p=presets[n];if(!p)return;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===n));transition={s:performance.now(),d:instant?1:700,a:camera.position.clone(),b:p.pos.clone(),ta:controls.target.clone(),tb:p.target.clone(),fa:camera.fov,fb:p.fov}}
function trans(t){if(!transition)return;let x=Math.min(1,(t-transition.s)/transition.d);x=1-Math.pow(1-x,3);camera.position.lerpVectors(transition.a,transition.b,x);controls.target.lerpVectors(transition.ta,transition.tb,x);camera.fov=THREE.MathUtils.lerp(transition.fa,transition.fb,x);camera.updateProjectionMatrix();if(x>=1)transition=null}
function resize(){renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.35:1.8)*state.scale);renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();$('scale').textContent=Math.round(state.scale*100)+'%'}addEventListener('resize',resize,{passive:true});
document.querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>{state.tour=false;b('tour',0);go(x.dataset.view)});$('gi').onclick=()=>{giW.value=giW.value>.5?0:1;b('gi',giW.value)};$('ao').onclick=()=>{aoW.value=aoW.value>.5?0:1;b('ao',aoW.value)};$('taa').onclick=()=>{taaW.value=taaW.value>.5?0:1;b('taa',taaW.value)};$('bloom').onclick=()=>{bloomW.value=bloomW.value>.5?0:1;b('bloom',bloomW.value)};$('tour').onclick=()=>{state.tour=!state.tour;b('tour',state.tour?1:0);tourAt=performance.now()+2200};$('collapse').onclick=()=>{$('hud').classList.toggle('min');$('collapse').textContent=$('hud').classList.contains('min')?'+':'−'};
function loop(t){const st=performance.now();trans(t);controls.update();if(state.tour&&!transition&&t>tourAt){const n=['hero','center','arcade','balcony','side','wide'];tourI=(tourI+1)%n.length;go(n[tourI]);tourAt=t+4200}pipeline.render();frames++;perf+=performance.now()-st;perfN++;if(t-fpsStart>900){$('fps').textContent=Math.round(frames*1000/(t-fpsStart))+' fps';frames=0;fpsStart=t}if(perfN>=100){const avg=perf/perfN,o=state.scale;if(avg>23&&state.scale>state.min)state.scale=Math.max(state.min,state.scale-.05);else if(avg<14&&state.scale<state.max)state.scale=Math.min(state.max,state.scale+.04);perf=0;perfN=0;if(o!==state.scale)resize()}}
init();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta name="theme-color" content="#0a0d12"><title>Sponza GI</title><style>html,body{margin:0;background:#0a0d12;color:#fff;font-family:system-ui;height:100%;display:grid;place-items:center}#s{opacity:.75;font-size:14px;padding:24px;text-align:center}</style></head><body><div id="s">Loading mobile-safe renderer…</div><script>(async()=>{try{const src='https://raw.githubusercontent.com/cybrdelic/cybrdelic.github.io/master/sponza-gi/speedball2.html?x='+Date.now();const r=await fetch(src,{cache:'no-store'});if(!r.ok)throw Error('source '+r.status);let h=await r.text();const old="renderer=new THREE.WebGPURenderer({antialias:false,powerPreference:'high-performance'});renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;document.body.prepend(renderer.domElement);await renderer.init();$('backend').textContent=navigator.gpu?'WebGPU':'WebGL2';";const neu="renderer=new THREE.WebGPURenderer({antialias:false,powerPreference:'high-performance',forceWebGL:mobile});renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;document.body.prepend(renderer.domElement);$('loadmsg').textContent=mobile?'Starting WebGL2 renderer…':'Starting WebGPU renderer…';await renderer.init();$('backend').textContent=mobile?'WebGL2':(navigator.gpu?'WebGPU':'WebGL2');";if(!h.includes(old))throw Error('renderer patch target not found');h=h.replace(old,neu);document.open();document.write(h);document.close()}catch(e){document.getElementById('s').textContent='Could not start patched renderer: '+e.message}})();</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070a">
<title>Sponza GI — Three.js</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#e9eef5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app,canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));z-index:5;background:rgba(7,10,14,.68);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;box-shadow:0 10px 40px rgba(0,0,0,.24);max-width:min(360px,calc(100vw - 24px));font-size:12px;line-height:1.35;user-select:none}
#title{font-size:13px;font-weight:750;letter-spacing:.02em}.muted{opacity:.66}.row{display:flex;gap:8px;align-items:center;margin-top:7px;flex-wrap:wrap}
button{appearance:none;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;border-radius:10px;padding:7px 9px;font:inherit;font-weight:650}
button:active{transform:scale(.98)}
.badge{padding:3px 6px;border-radius:8px;background:rgba(255,255,255,.08)}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:#05070a}
#card{text-align:center;padding:24px}.bar{width:min(310px,72vw);height:4px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:14px auto 0}.bar>i{display:block;width:32%;height:100%;background:#fff;animation:load 1.1s ease-in-out infinite alternate;border-radius:99px}@keyframes load{to{transform:translateX(210%)}}
#error{display:none;color:#ffb8b8;max-width:680px}
#hint{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:5;background:rgba(7,10,14,.58);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 10px;font-size:11px;opacity:.82;pointer-events:none}
@media(max-width:600px){#hud{padding:8px 10px}#hint{font-size:10px}}
</style>
<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app"></div>
<div id="loading"><div id="card"><div style="font-weight:800;font-size:18px">SPONZA GI</div><div class="muted" style="margin-top:6px">Loading geometry + textures…</div><div class="bar"><i></i></div><div id="error"></div></div></div>
<div id="hud">
  <div id="title">Sponza • real-time screen-space GI</div>
  <div class="row"><span class="badge" id="fps">-- fps</span><span class="badge" id="res">--</span><span class="badge" id="quality">--</span></div>
  <div class="row">
    <button id="giBtn">GI: on</button>
    <button id="bloomBtn">Bloom: on</button>
    <button id="gyroBtn">Gyro</button>
  </div>
  <div class="muted" style="margin-top:7px">Diffuse color bleed + GTAO-style occlusion + temporal accumulation + stabilized bloom. Dynamic internal resolution on mobile.</div>
</div>
<div id="hint">drag: look • pinch: zoom • two-finger: pan</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.getElementById('app');
const loading = document.getElementById('loading');
const errorEl = document.getElementById('error');
const fpsEl = document.getElementById('fps');
const resEl = document.getElementById('res');
const qualityEl = document.getElementById('quality');
const giBtn = document.getElementById('giBtn');
const bloomBtn = document.getElementById('bloomBtn');
const gyroBtn = document.getElementById('gyroBtn');

const isMobile = matchMedia('(pointer:coarse)').matches || /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const state = {
  gi: true, bloom: true, gyro: false,
  renderScale: isMobile ? 0.68 : 0.88,
  minScale: isMobile ? 0.50 : 0.65,
  maxScale: isMobile ? 0.82 : 1.0,
  giSamples: isMobile ? 8 : 12,
  frame: 0, historyValid: false
};

let renderer, scene, camera, controls;
let baseRT, normalRT, giRT, taaA, taaB, bloomA, bloomB;
let normalMaterial, fullscreenScene, fullscreenCamera, quad;
let giMat, taaMat, bloomExtractMat, blurHMat, blurVMat, compositeMat, copyMat;
let historyRead, historyWrite;
let prevCamPos = new THREE.Vector3(), prevCamQuat = new THREE.Quaternion();
let lastSizeW = 0, lastSizeH = 0;
let gyroBaseline = null, gyroAngles = {alpha:0,beta:0,gamma:0};
let fpsAccum = 0, fpsFrames = 0, fpsLast = performance.now();
let perfAccum = 0, perfFrames = 0;

function fail(msg) {
  errorEl.style.display='block';
  errorEl.textContent = msg;
  loading.querySelector('.muted').textContent = 'Could not start demo';
}

function makeRenderer(){
  try {
    const r = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance', alpha:false, stencil:false});
    r.outputColorSpace = THREE.SRGBColorSpace;
    r.toneMapping = THREE.NoToneMapping;
    r.setClearColor(0x05070a,1);
    r.debug.checkShaderErrors = true;
    app.appendChild(r.domElement);
    return r;
  } catch(e){ fail('WebGL2 renderer failed: '+e.message); throw e; }
}

renderer = makeRenderer();
scene = new THREE.Scene();
scene.background = new THREE.Color(0x07090c);
camera = new THREE.PerspectiveCamera(60,1,0.05,200);
camera.position.set(8,3.2,0);
controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.screenSpacePanning = true;
controls.target.set(0,2.4,0);
controls.minDistance = 0.8;
controls.maxDistance = 35;
controls.maxPolarAngle = Math.PI*0.97;
controls.touches.ONE = THREE.TOUCH.ROTATE;
controls.touches.TWO = THREE.TOUCH.DOLLY_PAN;

scene.add(new THREE.HemisphereLight(0x90a9c5,0x2c1e16,0.55));
const sun = new THREE.DirectionalLight(0xffe2b2,5.0);
sun.position.set(-4,12,3);
scene.add(sun);

const warm = new THREE.PointLight(0xff8d55,45,15,2.0); warm.position.set(-4.2,3.6,0.3); scene.add(warm);
const cool = new THREE.PointLight(0x6fa7ff,35,13,2.0); cool.position.set(4.0,3.1,-0.4); scene.add(cool);

normalMaterial = new THREE.MeshNormalMaterial();
normalMaterial.side = THREE.DoubleSide;

fullscreenScene = new THREE.Scene();
fullscreenCamera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
quad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), new THREE.MeshBasicMaterial());
fullscreenScene.add(quad);

const vs = `varying vec2 vUv; void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`;

giMat = new THREE.ShaderMaterial({
  vertexShader:vs,
  fragmentShader:`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tColor;
    uniform sampler2D tDepth;
    uniform sampler2D tNormal;
    uniform vec2 texel;
    uniform float frame;
    uniform float enabled;
    uniform float aspect;
    float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
    vec3 decN(vec3 n){ return normalize(n*2.-1.); }
    void main(){
      vec3 base=texture2D(tColor,vUv).rgb;
      if(enabled<.5){gl_FragColor=vec4(base,1.);return;}
      float d0=texture2D(tDepth,vUv).r;
      vec3 n0=decN(texture2D(tNormal,vUv).rgb);
      if(d0>=.99999){gl_FragColor=vec4(base,1.);return;}
      float rot=6.2831853*hash12(gl_FragCoord.xy+frame);
      mat2 R=mat2(cos(rot),-sin(rot),sin(rot),cos(rot));
      vec3 bounce=vec3(0.);
      float occ=0.,ws=0.;
      const int S=12;
      for(int i=0;i<S;i++){
        float fi=float(i)+.5;
        float a=fi*2.39996323;
        float rr=sqrt(fi/12.0);
        vec2 dir=R*vec2(cos(a),sin(a));
        vec2 uv=vUv+dir*texel*(3.0+rr*24.0)*vec2(1.0,aspect);
        if(any(lessThan(uv,vec2(0.)))||any(greaterThan(uv,vec2(1.)))) continue;
        float d=texture2D(tDepth,uv).r;
        vec3 n=decN(texture2D(tNormal,uv).rgb);
        vec3 c=texture2D(tColor,uv).rgb;
        float dd=d-d0;
        float nearW=exp(-abs(dd)*220.0);
        float normalW=clamp(dot(n0,n)*.5+.5,0.,1.);
        float edgeW=nearW*(.25+.75*normalW);
        float oc=step(d+0.00025,d0)*exp(-abs(dd)*90.0);
        occ += oc*(1.0-rr*.55);
        bounce += c*edgeW*(.35+.65*(1.0-rr));
        ws += edgeW*(.35+.65*(1.0-rr));
      }
      bounce/=max(ws,.001);
      float ao=clamp(1.0-occ/7.5,0.36,1.0);
      vec3 indirect=bounce*0.30*(1.0-clamp(dot(base,vec3(.2126,.7152,.0722)),0.,1.)*.18);
      vec3 outc=base*ao+indirect;
      gl_FragColor=vec4(outc,1.);
    }`,
  uniforms:{
    tColor:{value:null},tDepth:{value:null},tNormal:{value:null},
    texel:{value:new THREE.Vector2(1,1)},frame:{value:0},enabled:{value:1},aspect:{value:1}
  },
  depthTest:false,depthWrite:false
});

taaMat = new THREE.ShaderMaterial({
  vertexShader:vs,
  fragmentShader:`
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D currentTex;
  uniform sampler2D historyTex;
  uniform vec2 texel;
  uniform float historyWeight;
  float luma(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
  void main(){
    vec3 c=texture2D(currentTex,vUv).rgb;
    vec3 mn=c,mx=c;
    vec2 o=texel;
    vec3 s1=texture2D(currentTex,vUv+vec2(o.x,0.)).rgb;
    vec3 s2=texture2D(currentTex,vUv-vec2(o.x,0.)).rgb;
    vec3 s3=texture2D(currentTex,vUv+vec2(0.,o.y)).rgb;
    vec3 s4=texture2D(currentTex,vUv-vec2(0.,o.y)).rgb;
    mn=min(mn,min(min(s1,s2),min(s3,s4)));
    mx=max(mx,max(max(s1,s2),max(s3,s4)));
    vec3 h=clamp(texture2D(historyTex,vUv).rgb,mn,mx);
    float dl=abs(luma(c)-luma(h));
    float reject=smoothstep(.045,.22,dl);
    float w=historyWeight*(1.0-reject*.90);
    w*=1.0-smoothstep(1.3,3.0,max(max(c.r,c.g),c.b))*.35;
    gl_FragColor=vec4(mix(c,h,clamp(w,0.,.965)),1.);
  }`,
  uniforms:{currentTex:{value:null},historyTex:{value:null},texel:{value:new THREE.Vector2(1,1)},historyWeight:{value:0}}
});

bloomExtractMat = new THREE.ShaderMaterial({
  vertexShader:vs,
  fragmentShader:`
  varying vec2 vUv; uniform sampler2D t; uniform float enabled;
  void main(){vec3 c=texture2D(t,vUv).rgb;if(enabled<.5){gl_FragColor=vec4(0.);return;}
  float m=max(max(c.r,c.g),c.b);float knee=.30;float x=max(m-1.0+knee,0.0);x=x*x/(4.0*knee+1e-4);float w=max(m-1.0,x)/max(m,1e-4);
  gl_FragColor=vec4(c*w,1.);}`,
  uniforms:{t:{value:null},enabled:{value:1}}
});

function blurMat(horizontal){
  return new THREE.ShaderMaterial({
    vertexShader:vs,
    fragmentShader:`
    varying vec2 vUv; uniform sampler2D t; uniform vec2 texel;
    void main(){
      vec2 d=${horizontal?'vec2(texel.x,0.)':'vec2(0.,texel.y)'};
      vec3 c=texture2D(t,vUv).rgb*.227027;
      c+=texture2D(t,vUv+d*1.384615).rgb*.316216;
      c+=texture2D(t,vUv-d*1.384615).rgb*.316216;
      c+=texture2D(t,vUv+d*3.230769).rgb*.070270;
      c+=texture2D(t,vUv-d*3.230769).rgb*.070270;
      gl_FragColor=vec4(c,1.);
    }`,
    uniforms:{t:{value:null},texel:{value:new THREE.Vector2(1,1)}}
  });
}
blurHMat=blurMat(true); blurVMat=blurMat(false);

compositeMat = new THREE.ShaderMaterial({
  vertexShader:vs,
  fragmentShader:`
  varying vec2 vUv; uniform sampler2D sceneTex; uniform sampler2D bloomTex; uniform float bloomOn;
  vec3 aces(vec3 x){float a=2.51,b=.03,c=2.43,d=.59,e=.14;return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.,1.);}
  void main(){vec3 c=texture2D(sceneTex,vUv).rgb+texture2D(bloomTex,vUv).rgb*.16*bloomOn;c=aces(c*1.18);c=pow(c,vec3(1.0/2.2));gl_FragColor=vec4(c,1.);}`,
  uniforms:{sceneTex:{value:null},bloomTex:{value:null},bloomOn:{value:1}}
});

copyMat = new THREE.ShaderMaterial({
 vertexShader:vs,fragmentShader:`varying vec2 vUv;uniform sampler2D t;void main(){gl_FragColor=texture2D(t,vUv);}`,uniforms:{t:{value:null}}
});

function rt(w,h,depth=false){
  const o={type:THREE.HalfFloatType,format:THREE.RGBAFormat,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,depthBuffer:depth,stencilBuffer:false};
  const r=new THREE.WebGLRenderTarget(w,h,o);
  if(depth){
    r.depthTexture=new THREE.DepthTexture(w,h,THREE.UnsignedIntType);
    r.depthTexture.format=THREE.DepthFormat;
    r.depthTexture.minFilter=THREE.NearestFilter;r.depthTexture.magFilter=THREE.NearestFilter;
  }
  return r;
}
function disposeRT(x){if(x)x.dispose();}
function allocTargets(){
  const dpr=Math.min(devicePixelRatio||1,isMobile?1.4:1.75);
  const w=Math.max(320,Math.floor(innerWidth*dpr*state.renderScale));
  const h=Math.max(240,Math.floor(innerHeight*dpr*state.renderScale));
  if(w===lastSizeW&&h===lastSizeH)return;
  lastSizeW=w;lastSizeH=h;
  [baseRT,normalRT,giRT,taaA,taaB,bloomA,bloomB].forEach(disposeRT);
  baseRT=rt(w,h,true); normalRT=rt(w,h,false); giRT=rt(w,h,false);
  taaA=rt(w,h,false); taaB=rt(w,h,false);
  bloomA=rt(Math.max(1,w>>1),Math.max(1,h>>1),false); bloomB=rt(Math.max(1,w>>1),Math.max(1,h>>1),false);
  historyRead=taaA;historyWrite=taaB;state.historyValid=false;
  giMat.uniforms.texel.value.set(1/w,1/h); giMat.uniforms.aspect.value=w/h;
  taaMat.uniforms.texel.value.set(1/w,1/h);
  bloomExtractMat.uniforms.enabled.value=state.bloom?1:0;
  blurHMat.uniforms.texel.value.set(1/bloomA.width,1/bloomA.height);
  blurVMat.uniforms.texel.value.set(1/bloomA.width,1/bloomA.height);
  renderer.setPixelRatio(dpr);
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  resEl.textContent=`${w}×${h}`;
  qualityEl.textContent=(isMobile?'mobile ':'desktop ')+Math.round(state.renderScale*100)+'%';
}
addEventListener('resize',allocTargets,{passive:true});

function fs(mat,target){
  quad.material=mat;
  renderer.setRenderTarget(target);
  renderer.setViewport(0,0,target?target.width:renderer.domElement.width,target?target.height:renderer.domElement.height);
  renderer.render(fullscreenScene,fullscreenCamera);
}

async function loadSponza(){
  const loader=new GLTFLoader();
  const urls=[
   'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Sponza/glTF/Sponza.gltf',
   'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Sponza/glTF/Sponza.gltf'
  ];
  let lastErr;
  for(const url of urls){
    try{
      const gltf=await loader.loadAsync(url);
      const root=gltf.scene;
      root.traverse(o=>{
        if(o.isMesh){
          o.frustumCulled=true;
          if(o.material){
            o.material.side=THREE.FrontSide;
            o.material.envMapIntensity=.15;
          }
        }
      });
      const box=new THREE.Box3().setFromObject(root);
      const size=box.getSize(new THREE.Vector3());
      const center=box.getCenter(new THREE.Vector3());
      root.position.sub(center);
      root.position.y += size.y*.5;
      const largest=Math.max(size.x,size.z);
      const scl=14/largest;
      root.scale.setScalar(scl);
      scene.add(root);
      controls.target.set(0,2.6,0);
      camera.position.set(7.3,3.4,0.7);
      controls.update();
      return;
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error('Sponza failed to load');
}

function cameraMoved(){
  const pd=camera.position.distanceTo(prevCamPos);
  const qd=1-Math.abs(camera.quaternion.dot(prevCamQuat));
  prevCamPos.copy(camera.position);prevCamQuat.copy(camera.quaternion);
  return pd>.0025||qd>.000003;
}

function renderFrame(t){
  const t0=performance.now();
  controls.update();

  if(state.gyro&&gyroBaseline){
    const dy=(gyroAngles.alpha-gyroBaseline.alpha)*Math.PI/180;
    const dp=(gyroAngles.beta-gyroBaseline.beta)*Math.PI/180;
    controls.target.set(
      camera.position.x-Math.sin(dy)*Math.cos(dp)*5,
      camera.position.y+Math.sin(dp)*5,
      camera.position.z-Math.cos(dy)*Math.cos(dp)*5
    );
  }

  const moved=cameraMoved();
  if(moved) state.historyValid=false;

  renderer.setViewport(0,0,baseRT.width,baseRT.height);
  renderer.setRenderTarget(baseRT);
  renderer.setClearColor(0x07090c,1);
  renderer.clear(true,true,true);
  renderer.render(scene,camera);

  const oldBg=scene.background; scene.background=null;
  scene.overrideMaterial=normalMaterial;
  renderer.setRenderTarget(normalRT);
  renderer.setClearColor(0x8080ff,1); renderer.clear(true,true,true);
  renderer.render(scene,camera);
  scene.overrideMaterial=null; scene.background=oldBg;

  giMat.uniforms.tColor.value=baseRT.texture;
  giMat.uniforms.tDepth.value=baseRT.depthTexture;
  giMat.uniforms.tNormal.value=normalRT.texture;
  giMat.uniforms.frame.value=state.frame++;
  giMat.uniforms.enabled.value=state.gi?1:0;
  fs(giMat,giRT);

  taaMat.uniforms.currentTex.value=giRT.texture;
  taaMat.uniforms.historyTex.value=historyRead.texture;
  taaMat.uniforms.historyWeight.value=state.historyValid ? (moved ? .18 : .91) : 0;
  fs(taaMat,historyWrite);
  state.historyValid=true;

  bloomExtractMat.uniforms.t.value=historyWrite.texture;
  bloomExtractMat.uniforms.enabled.value=state.bloom?1:0;
  fs(bloomExtractMat,bloomA);
  blurHMat.uniforms.t.value=bloomA.texture; fs(blurHMat,bloomB);
  blurVMat.uniforms.t.value=bloomB.texture; fs(blurVMat,bloomA);

  compositeMat.uniforms.sceneTex.value=historyWrite.texture;
  compositeMat.uniforms.bloomTex.value=bloomA.texture;
  compositeMat.uniforms.bloomOn.value=state.bloom?1:0;
  fs(compositeMat,null);

  [historyRead,historyWrite]=[historyWrite,historyRead];

  const dt=performance.now()-t0;
  perfAccum+=dt;perfFrames++;
  fpsAccum+=1;fpsFrames++;
  if(t-fpsLast>1000){
    const fps=fpsFrames*1000/(t-fpsLast);
    fpsEl.textContent=`${Math.round(fps)} fps`;
    const avg=perfAccum/Math.max(1,perfFrames);
    if(perfFrames>20){
      const target=isMobile?24:42;
      if(avg>1000/target*1.20&&state.renderScale>state.minScale){
        state.renderScale=Math.max(state.minScale,state.renderScale-.06);allocTargets();
      } else if(avg<1000/target*.68&&state.renderScale<state.maxScale){
        state.renderScale=Math.min(state.maxScale,state.renderScale+.04);allocTargets();
      }
    }
    fpsFrames=0;perfAccum=0;perfFrames=0;fpsLast=t;
  }
  requestAnimationFrame(renderFrame);
}

giBtn.onclick=()=>{state.gi=!state.gi;giBtn.textContent='GI: '+(state.gi?'on':'off');state.historyValid=false;};
bloomBtn.onclick=()=>{state.bloom=!state.bloom;bloomBtn.textContent='Bloom: '+(state.bloom?'on':'off');state.historyValid=false;};

window.addEventListener('deviceorientation',e=>{
  if(e.alpha==null)return;
  gyroAngles.alpha=e.alpha;gyroAngles.beta=e.beta||0;gyroAngles.gamma=e.gamma||0;
},{passive:true});
gyroBtn.onclick=async()=>{
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      const p=await DeviceOrientationEvent.requestPermission(); if(p!=='granted')return;
    }
    state.gyro=!state.gyro;
    gyroBaseline=state.gyro?{...gyroAngles}:null;
    gyroBtn.textContent=state.gyro?'Gyro: on':'Gyro';
  }catch(e){gyroBtn.textContent='Gyro unavailable';}
};

(async()=>{
  try{
    allocTargets();
    await loadSponza();
    loading.style.display='none';
    prevCamPos.copy(camera.position);prevCamQuat.copy(camera.quaternion);
    requestAnimationFrame(renderFrame);
  }catch(e){
    console.error(e);fail('Asset load failed. '+(e?.message||e));
  }
})();
</script>
</body>
</html>

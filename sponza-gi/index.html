<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const $=id=>document.getElementById(id),app=$('app'),loading=$('loading'),errorEl=$('error'),fpsEl=$('fps'),resEl=$('res'),qualityEl=$('quality'),giBtn=$('giBtn'),bloomBtn=$('bloomBtn'),gyroBtn=$('gyroBtn'),autoBtn=$('autoBtn'),minBtn=$('minBtn'),hud=$('hud'),toast=$('toast');
const mobile=matchMedia('(pointer:coarse)').matches||/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const state={gi:true,bloom:true,gyro:false,auto:false,scale:mobile?.72:.90,min:mobile?.55:.70,max:mobile?.86:1,history:false,frame:0};
let renderer,scene,camera,controls,baseRT,normalRT,giRT,taaA,taaB,bloomA,bloomB,normalMat,fsScene,fsCam,quad,giMat,taaMat,bloomMat,blurH,blurV,compMat,historyRead,historyWrite;
let modelBounds=null,presets={},activeView='hero',transition=null,autoTimer=0,autoIndex=0;
let prevPos=new THREE.Vector3(),prevQuat=new THREE.Quaternion(),perfSum=0,perfN=0,fpsFrames=0,fpsStart=performance.now(),gyroBase=null,gyro={a:0,b:0,g:0};

function fail(m){errorEl.style.display='block';errorEl.textContent=m;loading.querySelector('.muted').textContent='Could not start demo'}

renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance',alpha:false,stencil:false});

giMat=new THREE.ShaderMaterial({vertexShader:vs,fragmentShader:`precision highp float;varying vec2 vUv;uniform sampler2D cTex,dTex,nTex;uniform vec2 px;uniform float enabled;vec3 N(vec3 n){return normalize(n*2.-1.);}void main(){vec3 c=texture2D(cTex,vUv).rgb;if(enabled<.5){gl_FragColor=vec4(c,1.);return;}float d0=texture2D(dTex,vUv).r;if(d0>.9999){gl_FragColor=vec4(c,1.);return;}vec3 n0=N(texture2D(nTex,vUv).rgb),bounce=vec3(0.);float wsum=0.,occ=0.;const int S=12;for(int i=0;i<S;i++){float fi=float(i)+.5;float a=fi*2.39996323;float r=sqrt(fi/12.);vec2 dir=vec2(cos(a),sin(a));vec2 uv=vUv+dir*px*(4.+r*22.);if(any(lessThan(uv,vec2(0.)))||any(greaterThan(uv,vec2(1.))))continue;float d=texture2D(dTex,uv).r;vec3 n=N(texture2D(nTex,uv).rgb),s=texture2D(cTex,uv).rgb;float dz=abs(d-d0),dw=exp(-dz*170.);float nw=max(dot(n0,n),0.);float w=dw*(.30+.70*nw)*(1.-r*.38);bounce+=s*w;wsum+=w;occ+=step(d+.0004,d0)*exp(-dz*78.)*(1.-r*.5);}bounce/=max(wsum,.001);float ao=clamp(1.-occ/8.6,.50,1.);float lum=dot(c,vec3(.2126,.7152,.0722));vec3 indirect=bounce*.16*(1.-smoothstep(.65,1.6,lum)*.55);gl_FragColor=vec4(c*ao+indirect,1.);}`,uniforms:{cTex:{value:null},dTex:{value:null},nTex:{value:null},px:{value:new THREE.Vector2(1)},enabled:{value:1}},depthTest:false,depthWrite:false});

function blur(horizontal){return new THREE.ShaderMaterial({vertexShader:vs,fragmentShader:`varying vec2 vUv;uniform sampler2D t;uniform vec2 px;void main(){vec2 d=${horizontal?'vec2(px.x,0.)':'vec2(0.,px.y)'};vec3 c=texture2D(t,vUv).rgb*.227027;c+=(texture2D(t,vUv+d*1.384615).rgb+texture2D(t,vUv-d*1.384615).rgb)*.316216;c+=(texture2D(t,vUv+d*3.230769).rgb+texture2D(t,vUv-d*3.230769).rgb)*.070270;gl_FragColor=vec4(c,1.);}`,uniforms:{t:{value:null},px:{value:new THREE.Vector2(1)}},depthTest:false,depthWrite:false})}blurH=blur(true);blurV=blur(false);

function rt(w,h,depth=false){const o={type:THREE.HalfFloatType,format:THREE.RGBAFormat,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,depthBuffer:depth,stencilBuffer:false};const r=new THREE.WebGLRenderTarget(w,h,o);if(depth)r.depthTexture=new THREE.DepthTexture(w,h,THREE.UnsignedIntType);return r}

addEventListener('deviceorientation',e=>{gyro.a=e.alpha||0;gyro.b=e.beta||0;gyro.g=e.gamma||0;if(state.gyro&&!gyroBase)gyroBase={...gyro}},{passive:true});

const loader=new GLTFLoader();const asset='https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Sponza/glTF-Binary/Sponza.glb';
loader.load(asset,g=>{const root=g.scene;root.traverse(o=>{if(o.isMesh){o.frustumCulled=true;if(o.material){o.material.side=THREE.FrontSide;o.material.needsUpdate=true}}});scene.add(root);modelBounds=new THREE.Box3().setFromObject(root);buildPresets(modelBounds);goView('hero',true);resize(true);loading.style.display='none';requestAnimationFrame(loop)},undefined,e=>fail('Sponza failed to load: '+(e?.message||e)));

giMat.uniforms.cTex.value=baseRT.texture;giMat.uniforms.dTex.value=baseRT.depthTexture;giMat.uniforms.nTex.value=normalRT.texture;giMat.uniforms.enabled.value=state.gi?1:0;pass(giMat,giRT);

bloomMat.uniforms.t.value=historyRead.texture;bloomMat.uniforms.enabled.value=state.bloom?1:0;pass(bloomMat,bloomA);blurH.uniforms.t.value=bloomA.texture;pass(blurH,bloomB);blurV.uniforms.t.value=bloomB.texture;pass(blurV,bloomA);compMat.uniforms.s.value=historyRead.texture;compMat.uniforms.b.value=bloomA.texture;compMat.uniforms.bloom.value=state.bloom?.16:0;pass(compMat,null);
const ms=performance.now()-start;perfSum+=ms;perfN++;fpsFrames++;if(now-fpsStart>900){fpsEl.textContent=`${Math.round(fpsFrames*1000/(now-fpsStart))} fps`;fpsFrames=0;fpsStart=now}if(perfN>=90){const avg=perfSum/perfN,oldScale=state.scale;if(avg>21&&state.scale>state.min)state.scale=Math.max(state.min,state.scale-.05);else if(avg<13.5&&state.scale<state.max)state.scale=Math.min(state.max,state.scale+.04);perfSum=0;perfN=0;if(Math.abs(oldScale-state.scale)>.001)resize(true)}}
